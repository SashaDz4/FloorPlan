services:
  # The UI - what `docker compose up` starts. Open http://localhost:8000
  #
  # 0.0.0.0 is needed for the container to accept the forwarded port; the
  # published mapping below is what keeps it on this machine.
  floorplan:
    build: .
    image: floorplan-2d:latest
    working_dir: /app
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    command: ["--host", "0.0.0.0", "--port", "8000",
              "--input", "data/input_images"]

  # One-off batch run, writing into data/outputs:
  #     docker compose run --rm batch
  # Behind a profile so a plain `docker compose up` does not start it.
  batch:
    build: .
    image: floorplan-2d:latest
    working_dir: /app
    profiles: ["batch"]
    volumes:
      - ./data:/app/data
    command: ["--batch", "--input", "data/input_images",
              "--output", "data/outputs"]
